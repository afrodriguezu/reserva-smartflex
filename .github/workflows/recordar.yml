name: 2. Recordar a las 9:20 pm

on:
  # Sin 'schedule': solo corre cuando lo llama el reloj externo
  # (cron-job.org) o cuando lo lanzas a mano. Ver RELOJ-EXTERNO.md
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  # Grupo propio: si compartiera el de escuchar.yml, una corrida de escuchar
  # que llegue mientras esta espera la cancelaria y se perderia el
  # recordatorio de las 9:20, que es la corrida mas importante del dia.
  group: recordar
  cancel-in-progress: false

jobs:
  recordar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install requests
      - env:
          SMARTFLEX_DOC: ${{ secrets.SMARTFLEX_DOC }}
          SMARTFLEX_EMAIL: ${{ secrets.SMARTFLEX_EMAIL }}
          SMARTFLEX_DEVICE_ID: ${{ secrets.SMARTFLEX_DEVICE_ID }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python reservar_smartflex.py --modo recordar
      - name: Guardar estado
        if: always()
        run: |
          if [[ -z "$(git status --porcelain estado.json)" ]]; then
            echo "estado.json sin cambios"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          MENSAJE="estado: recordatorio"
          git add estado.json
          git commit -m "$MENSAJE"
          # Si otra corrida empujo primero, gana la version del bot que acaba
          # de correr: se trae lo remoto, se reimpone estado.json y se reintenta.
          for intento in 1 2 3; do
            if git push; then
              exit 0
            fi
            echo "push rechazado, reintento $intento"
            cp estado.json /tmp/estado.json
            git fetch origin main
            git reset --hard FETCH_HEAD
            cp /tmp/estado.json estado.json
            if [[ -z "$(git status --porcelain estado.json)" ]]; then
              echo "la otra corrida ya guardo lo mismo, no hay nada que empujar"
              exit 0
            fi
            git add estado.json
            git commit -m "$MENSAJE"
            sleep $((RANDOM % 4 + 2))
          done
          echo "No pude guardar estado.json despues de 3 intentos"
          exit 1
